name: publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump kind
        type: choice
        options: [build, feature]
        default: build
      skip_checks:
        description: Skip lint, tsc and tests
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install
      - name: Configure git identity
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/publish.ts --ci --bump ${{ inputs.bump }}${{ inputs.skip_checks && ' --skip-checks' || '' }}
